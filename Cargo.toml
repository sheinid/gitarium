[package]
name = "gitarium"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Grow a pixel-art island garden from Git history and export its life as MP4."
license = "MIT"
repository = "https://github.com/sheinid/gitarium"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
font8x8 = "0.3"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
